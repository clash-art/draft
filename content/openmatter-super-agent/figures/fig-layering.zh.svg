<svg width="1680" height="780" viewBox="0 0 1680 780" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layering-zh desc-layering-zh">
  <title id="layering-zh">工作工具 → Bond → Loop → AgentDriver → harness</title>
  <desc id="desc-layering-zh">Bond 负责 event 进 WorkEvent 与 effect 出 WorkEffect；Loop 声明形态，harness 经 AgentDriver 可换。</desc>
  <rect x="1" y="1" width="1678" height="778" rx="15" fill="#FDFDFB" stroke="#E4E5E7" stroke-width="2"/>
  <text x="56" y="48" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.2">OPENMATTER 边界</text>
  <text x="56" y="92" fill="#11110F" font-family="Noto Serif CJK SC, Source Serif 4, Georgia, serif" font-size="30" font-weight="600" letter-spacing="-0.4">工作工具 → Bond → Loop → AgentDriver → harness</text>
  <text x="56" y="126" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="17">换形态 = 换 Loop；换 harness = 换 Driver。Bond 抹平各平台差异：event 进、effect 出。</text>

  <!-- tools -->
  <rect x="48" y="168" width="200" height="520" rx="10" fill="#FFFFFF" stroke="#CECFD1" stroke-width="2"/>
  <text x="68" y="208" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="19" font-weight="650">工作工具</text>
  <line x1="68" y1="224" x2="220" y2="224" stroke="#E4E5E7" stroke-width="2"/>
  <circle cx="80" cy="262" r="6" fill="#1034A6"/>
  <text x="98" y="268" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="17">Slack</text>
  <circle cx="80" cy="304" r="6" fill="#1034A6" fill-opacity="0.85"/>
  <text x="98" y="310" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="17">飞书</text>
  <circle cx="80" cy="346" r="6" fill="#1034A6" fill-opacity="0.7"/>
  <text x="98" y="352" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="17">GitHub</text>
  <circle cx="80" cy="388" r="6" fill="#1034A6" fill-opacity="0.55"/>
  <text x="98" y="394" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="17">GitLab</text>
  <circle cx="80" cy="430" r="6" fill="#1034A6" fill-opacity="0.4"/>
  <text x="98" y="436" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="17">Linear</text>
  <text x="68" y="500" fill="#7A7C80" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14">webhook · 评论 · CI</text>
  <text x="68" y="560" fill="#0A2475" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14" font-weight="600">原生事件进</text>
  <text x="68" y="588" fill="#0A2475" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14" font-weight="600">原生操作出</text>

  <!-- ingress arrow tools → Bond (top) -->
  <path d="M248 300H288" stroke="#1034A6" stroke-width="3"/>
  <path d="M278 291L288 300L278 309" stroke="#1034A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="268" y="286" fill="#1034A6" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">event 进</text>

  <!-- egress arrow Bond ← tools (bottom, reverse) -->
  <path d="M288 560H248" stroke="#166747" stroke-width="3"/>
  <path d="M258 551L248 560L258 569" stroke="#166747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="268" y="546" fill="#166747" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">effect 出</text>

  <!-- Bond -->
  <rect x="288" y="168" width="230" height="520" rx="10" fill="#FFFFFF" stroke="#1034A6" stroke-width="2"/>
  <text x="310" y="208" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="19" font-weight="650">Bond</text>
  <line x1="310" y1="224" x2="490" y2="224" stroke="#E4E5E7" stroke-width="2"/>
  <text x="310" y="258" fill="#0A2475" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14" font-weight="600">统一接入层</text>

  <!-- ingress card -->
  <rect x="306" y="278" width="194" height="100" rx="7" fill="#EEF2FB" stroke="#1034A6" stroke-width="1.5"/>
  <text x="322" y="308" fill="#1034A6" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14" font-weight="650">event 进</text>
  <text x="322" y="334" fill="#11110F" font-family="JetBrains Mono, Noto Sans CJK SC, Menlo, monospace" font-size="15" font-weight="600">WorkEvent</text>
  <text x="322" y="360" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="13">ingest · 规范化</text>

  <!-- context -->
  <text x="322" y="420" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="15">上下文读</text>
  <text x="322" y="444" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="13">observe · bind</text>

  <!-- egress card -->
  <rect x="306" y="470" width="194" height="100" rx="7" fill="#ECF7F1" stroke="#166747" stroke-width="1.5"/>
  <text x="322" y="500" fill="#166747" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14" font-weight="650">effect 出</text>
  <text x="322" y="526" fill="#11110F" font-family="JetBrains Mono, Noto Sans CJK SC, Menlo, monospace" font-size="15" font-weight="600">WorkEffect</text>
  <text x="322" y="552" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="13">deliver · 回执</text>

  <text x="310" y="620" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="13">平台差异在这里被抹平</text>
  <text x="310" y="644" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="13">Loop 只见统一事件与操作</text>

  <!-- ingress Bond → OM -->
  <path d="M518 320H560" stroke="#1034A6" stroke-width="3"/>
  <path d="M550 311L560 320L550 329" stroke="#1034A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="539" y="306" fill="#1034A6" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">event 进</text>

  <!-- egress OM → Bond -->
  <path d="M560 520H518" stroke="#166747" stroke-width="3"/>
  <path d="M528 511L518 520L528 529" stroke="#166747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="539" y="506" fill="#166747" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">effect 出</text>

  <!-- OpenMatter core -->
  <rect x="560" y="168" width="500" height="520" rx="12" fill="#1034A6"/>
  <text x="588" y="204" fill="#DDE4F8" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="1.6">OPENMATTER</text>

  <!-- Loop box -->
  <rect x="588" y="224" width="444" height="168" rx="8" fill="#0A2475"/>
  <text x="610" y="258" fill="#FFFFFF" font-family="Noto Serif CJK SC, Source Serif 4, Georgia, serif" font-size="26" font-weight="600">Loop</text>
  <text x="610" y="290" fill="#DDE4F8" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="15">声明式：订阅 · 映射 thread/session · handler</text>
  <text x="610" y="322" fill="#FFFFFF" font-family="JetBrains Mono, Noto Sans CJK SC, Menlo, monospace" font-size="14">sources · associate · handler</text>
  <text x="610" y="354" fill="#B8C7EE" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14">claudeTag / linearLoop / coordinatorLoop …</text>
  <text x="610" y="378" fill="#B8C7EE" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="13">换一种形态 = 换一段 Loop</text>

  <text x="588" y="430" fill="#FFFFFF" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="16" font-weight="600">持久 inbox + lease</text>
  <text x="588" y="464" fill="#FFFFFF" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="16" font-weight="600">WorkThread / Session · Reaction</text>
  <text x="588" y="498" fill="#DDE4F8" font-family="JetBrains Mono, Noto Sans CJK SC, Menlo, monospace" font-size="14">delegate · steer · cancel · complete</text>
  <text x="588" y="532" fill="#FFFFFF" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="16" font-weight="600">回复 + CAS</text>
  <text x="588" y="572" fill="#B8C7EE" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14">event 进 inbox；effect 经 outbox</text>
  <text x="588" y="600" fill="#B8C7EE" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14">Loop 写在 agent 外面，由应用配置</text>

  <path d="M1060 400H1102" stroke="#1034A6" stroke-width="3"/>
  <path d="M1092 391L1102 400L1092 409" stroke="#1034A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Driver -->
  <text x="1114" y="156" fill="#7A7C80" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">可替换</text>
  <rect x="1102" y="168" width="200" height="520" rx="10" fill="#F7F7F6" stroke="#91A6DE" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="1122" y="340" width="160" height="120" rx="7" fill="#FFFFFF" stroke="#CECFD1" stroke-width="2"/>
  <text x="1138" y="388" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="17" font-weight="650">AgentDriver</text>
  <text x="1138" y="418" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14">turn · steer</text>
  <text x="1138" y="442" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14">session 约定</text>

  <path d="M1302 400H1344" stroke="#1034A6" stroke-width="3"/>
  <path d="M1334 391L1344 400L1334 409" stroke="#1034A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Harness -->
  <text x="1356" y="156" fill="#7A7C80" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">可替换</text>
  <rect x="1344" y="168" width="288" height="520" rx="10" fill="#F7F7F6" stroke="#91A6DE" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="1368" y="208" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="18" font-weight="650">Harness</text>
  <line x1="1368" y1="224" x2="1600" y2="224" stroke="#E4E5E7" stroke-width="2"/>
  <rect x="1368" y="250" width="240" height="88" rx="7" fill="#FFFFFF" stroke="#1034A6" stroke-width="2"/>
  <text x="1388" y="288" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="17" font-weight="650">Pi（pi-bot）</text>
  <text x="1388" y="316" fill="#0A2475" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14" font-weight="600">参考实现</text>
  <rect x="1368" y="360" width="240" height="120" rx="7" fill="#FFFFFF" stroke="#CECFD1" stroke-width="2"/>
  <text x="1388" y="404" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="15" font-weight="650">ACP · 托管</text>
  <text x="1388" y="432" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="15" font-weight="650">SDK · 自定义</text>
  <text x="1388" y="460" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="13">同一套 Driver 约定</text>
  <text x="1368" y="540" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="13">换 harness 时</text>
  <text x="1368" y="564" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="13">Loop 不用改</text>
</svg>
