<svg width="1500" height="820" viewBox="0 0 1500 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fresh-zh desc-fresh-zh">
  <title id="fresh-zh">回复前检查有没有更新的消息</title>
  <desc id="desc-fresh-zh">agent 想好回复之后、发出之前来的更正，会变成 conflict，随后送达 OM-CORRECTED。</desc>
  <rect x="1" y="1" width="1498" height="818" rx="15" fill="#FDFDFB" stroke="#E4E5E7" stroke-width="2"/>

  <text x="56" y="48" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.2">CAS · 回复前比对版本</text>
  <text x="56" y="92" fill="#11110F" font-family="Noto Serif CJK SC, Georgia, serif" font-size="34" font-weight="600">回复前检查有没有更新的消息</text>
  <text x="56" y="128" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="17">agent 想好回复之后、发出之前来的更正 → conflict · newer_messages · not-applied → 再送达 OM-CORRECTED</text>

  <!-- steps 1-3 row -->
  <rect x="56" y="172" width="280" height="112" rx="10" fill="#FFFFFF" stroke="#CECFD1" stroke-width="2"/>
  <text x="80" y="210" fill="#1034A6" font-family="JetBrains Mono, Menlo, monospace" font-size="15" font-weight="600">1</text>
  <text x="80" y="246" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="18" font-weight="650">agent 想好回复</text>
  <text x="80" y="274" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14">准备调用回复工具</text>

  <path d="M336 228H376" stroke="#1034A6" stroke-width="3"/>
  <path d="M366 219L376 228L366 237" stroke="#1034A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <rect x="376" y="172" width="280" height="112" rx="10" fill="#FFFFFF" stroke="#CECFD1" stroke-width="2"/>
  <text x="400" y="210" fill="#1034A6" font-family="JetBrains Mono, Menlo, monospace" font-size="15" font-weight="600">2</text>
  <text x="400" y="246" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="18" font-weight="650">用户更正到达</text>
  <text x="400" y="274" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14">版本号已前进</text>

  <path d="M656 228H696" stroke="#1034A6" stroke-width="3"/>
  <path d="M686 219L696 228L686 237" stroke="#1034A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <rect x="696" y="172" width="280" height="112" rx="10" fill="#FFFFFF" stroke="#CECFD1" stroke-width="2"/>
  <text x="720" y="210" fill="#1034A6" font-family="JetBrains Mono, Menlo, monospace" font-size="15" font-weight="600">3</text>
  <text x="720" y="246" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="18" font-weight="650">调用回复</text>
  <text x="720" y="274" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14">带上 turn 看到的版本</text>

  <path d="M976 228H1016" stroke="#1034A6" stroke-width="3"/>
  <path d="M1006 219L1016 228L1006 237" stroke="#1034A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- step 4 conflict highlight -->
  <rect x="1016" y="160" width="428" height="136" rx="10" fill="#FFF4D8" stroke="#734600" stroke-width="2"/>
  <text x="1040" y="198" fill="#734600" font-family="JetBrains Mono, Menlo, monospace" font-size="15" font-weight="600">4</text>
  <text x="1040" y="234" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="18" font-weight="650">conflict</text>
  <text x="1040" y="264" fill="#734600" font-family="JetBrains Mono, Noto Sans CJK SC, Menlo, monospace" font-size="15" font-weight="600">newer_messages · not-applied</text>
  <text x="1040" y="288" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="13">过时回复不会发出</text>

  <!-- down arrow into resolve -->
  <path d="M1230 296V340" stroke="#1034A6" stroke-width="3"/>
  <path d="M1221 330L1230 340L1239 330" stroke="#1034A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- steps 5-6 -->
  <rect x="1016" y="340" width="428" height="100" rx="10" fill="#ECF7F1" stroke="#166747" stroke-width="2"/>
  <text x="1040" y="378" fill="#166747" font-family="JetBrains Mono, Menlo, monospace" font-size="15" font-weight="600">5</text>
  <text x="1040" y="414" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="18" font-weight="650">agent 回复 OM-CORRECTED</text>

  <path d="M1230 440V476" stroke="#1034A6" stroke-width="3"/>
  <path d="M1221 466L1230 476L1239 466" stroke="#1034A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <rect x="1016" y="476" width="428" height="88" rx="10" fill="#FFFFFF" stroke="#166747" stroke-width="2"/>
  <text x="1040" y="512" fill="#166747" font-family="JetBrains Mono, Menlo, monospace" font-size="15" font-weight="600">6</text>
  <text x="1040" y="546" fill="#11110F" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="18" font-weight="650">送达 · delivered</text>

  <!-- OUTBOX panel -->
  <rect x="56" y="340" width="900" height="320" rx="14" fill="#FFFFFF" stroke="#1034A6" stroke-width="2"/>
  <text x="80" y="380" fill="#0A2475" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14" font-weight="650" letter-spacing="1.6">OUTBOX · 用户看到的</text>
  <text x="80" y="416" fill="#11110F" font-family="Noto Serif CJK SC, Georgia, serif" font-size="24" font-weight="600">outbox 里保留的送达回复</text>
  <text x="80" y="448" fill="#5D5F63" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="15">用户看到的内容</text>

  <rect x="80" y="480" width="380" height="72" rx="10" fill="#EEF2FB" stroke="#1034A6" stroke-width="1.5"/>
  <text x="104" y="524" fill="#11110F" font-family="JetBrains Mono, Noto Sans CJK SC, Menlo, monospace" font-size="18" font-weight="600">OM-REPLY-OK</text>

  <rect x="480" y="480" width="440" height="72" rx="10" fill="#ECF7F1" stroke="#166747" stroke-width="1.5"/>
  <text x="504" y="524" fill="#11110F" font-family="JetBrains Mono, Noto Sans CJK SC, Menlo, monospace" font-size="18" font-weight="600">OM-CORRECTED</text>

  <text x="80" y="596" fill="#7A7C80" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14">conflict 时过时回复 not-applied，随后送达 OM-CORRECTED。</text>
  <text x="80" y="624" fill="#7A7C80" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="14">outbox 里保留两条已送达回复。</text>

  <text x="56" y="780" fill="#7A7C80" font-family="Noto Sans CJK SC, Geist, Arial, sans-serif" font-size="15">做完了和告诉用户了是两步，这一步卡在发出之前。</text>
</svg>
